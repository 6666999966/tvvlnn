<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>念念不忘 | Our Little Universe</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- React & Babel Setup -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Styles -->
    <style>
        /* Theme Variables */
        :root {
          --bg-deep: #07091a;
          --bg-mid: #0d1032;

          --glass-surface: rgba(30, 25, 60, 0.25);
          --glass-border: rgba(200, 180, 240, 0.05);
          --glass-highlight: rgba(200, 180, 240, 0.08);

          --text-primary: rgba(255, 255, 255, 0.93);
          --text-secondary: #9890b8;
          --text-muted: #7870a8;

          --accent-soft: #ffb8c8;
          --accent-glow: rgba(255, 184, 200, 0.25);
          --counter-color: #e0d8f8;
          --aurora-purple: rgba(120, 100, 220, 0.06);
          --aurora-cyan: rgba(100, 160, 230, 0.04);
          --star-color: rgba(200, 200, 240, 0.35);

          --font-serif: 'Noto Serif SC', 'Playfair Display', serif;
          --font-sans: 'Inter', -apple-system, sans-serif;

          --easing-premium: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; }

        body {
          margin: 0;
          padding: 0;
          min-height: 100vh;
          background: var(--bg-deep);
          color: var(--text-primary);
          font-family: var(--font-sans);
          overflow-x: hidden;
          -webkit-font-smoothing: antialiased;
        }

        /* Aurora layers */
        body::before {
          content: '';
          position: fixed;
          inset: 0;
          pointer-events: none;
          z-index: 0;
          background:
            radial-gradient(ellipse at 30% 20%, var(--aurora-purple), transparent 50%),
            radial-gradient(ellipse at 60% 50%, var(--aurora-cyan), transparent 40%),
            radial-gradient(ellipse at 50% 80%, var(--aurora-purple), transparent 50%);
          filter: blur(20px);
          animation: auroraBreath 10s ease-in-out infinite;
        }

        /* Stars layer */
        body::after {
          content: '';
          position: fixed;
          inset: 0;
          pointer-events: none;
          z-index: 0;
          background-image:
            radial-gradient(1px 1px at 10% 8%, var(--star-color), transparent),
            radial-gradient(1px 1px at 25% 12%, rgba(220,200,240,0.3), transparent),
            radial-gradient(1.5px 1.5px at 60% 5%, rgba(200,200,240,0.35), transparent),
            radial-gradient(1px 1px at 78% 18%, rgba(220,210,240,0.3), transparent),
            radial-gradient(1px 1px at 90% 8%, rgba(200,200,240,0.4), transparent),
            radial-gradient(1px 1px at 15% 38%, rgba(180,220,240,0.25), transparent),
            radial-gradient(1px 1px at 85% 42%, rgba(200,200,240,0.3), transparent),
            radial-gradient(1px 1px at 45% 55%, rgba(200,200,240,0.25), transparent),
            radial-gradient(1px 1px at 70% 68%, rgba(210,200,240,0.3), transparent),
            radial-gradient(1px 1px at 20% 78%, rgba(200,200,240,0.25), transparent),
            radial-gradient(1px 1px at 55% 88%, rgba(200,210,240,0.3), transparent),
            radial-gradient(1px 1px at 82% 92%, rgba(220,200,240,0.3), transparent);
          animation: starTwinkle 4s ease-in-out infinite;
        }

        #root {
          position: relative;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          z-index: 1;
        }

        /* Typography */
        h1, h2, h3, h4 {
          font-family: var(--font-serif);
          font-weight: 500;
          margin: 0;
          letter-spacing: 0.03em;
        }

        .app-container {
          width: 100%;
          max-width: 480px;
          margin: 0 auto;
          padding: 32px 20px 120px;
          position: relative;
          z-index: 10;
        }

        .glass-panel {
          background: var(--glass-surface);
          -webkit-backdrop-filter: blur(20px);
          backdrop-filter: blur(20px);
          border: 1px solid var(--glass-border);
          border-radius: 16px;
          box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
          overflow: hidden;
          transition: border-color 0.4s var(--easing-premium);
        }

        .glass-panel:hover {
          border-color: rgba(200, 180, 240, 0.1);
        }

        header {
          text-align: center;
          margin-bottom: 28px;
          animation: fadeDown 1s var(--easing-premium) forwards;
        }

        .main-title {
          font-size: 1.5rem;
          color: var(--text-primary);
          margin-bottom: 8px;
          text-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
          line-height: 1.5;
        }

        .main-title span {
          color: var(--accent-soft);
          font-weight: 500;
        }

        .subtitle {
          font-size: 0.8rem;
          color: var(--text-secondary);
          letter-spacing: 0.04em;
          font-family: var(--font-sans);
        }

        .flow-column {
          display: flex;
          flex-direction: column;
          gap: 16px;
        }

        .gallery-section {
          position: relative;
          aspect-ratio: 4 / 3;
          border-radius: 16px;
          overflow: hidden;
          animation: fadeUp 0.8s var(--easing-premium) 0.15s forwards;
          opacity: 0;
        }

        .gallery-image {
          width: 100%;
          height: 100%;
          object-fit: cover;
          transition: opacity 0.5s ease;
          display: block;
        }

        .gallery-overlay {
          position: absolute;
          bottom: 0; left: 0; right: 0;
          padding: 50px 16px 16px;
          background: linear-gradient(to top, rgba(7, 9, 26, 0.9), transparent);
          pointer-events: none;
        }

        .gallery-caption {
          font-family: var(--font-serif);
          font-size: 0.95rem;
          color: rgba(255, 255, 255, 0.9);
        }

        .gallery-dots {
          position: absolute;
          bottom: 8px;
          left: 50%;
          transform: translateX(-50%);
          display: flex;
          gap: 5px;
          z-index: 20;
        }

        .gallery-dot {
          width: 5px;
          height: 5px;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.3);
          transition: background 0.3s;
        }

        .gallery-dot.active {
          background: #fff;
        }

        .gallery-nav-btn {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          background: rgba(30, 25, 60, 0.5);
          -webkit-backdrop-filter: blur(8px);
          backdrop-filter: blur(8px);
          border: none;
          color: rgba(255, 255, 255, 0.7);
          width: 36px; height: 36px;
          border-radius: 50%;
          cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: all 0.3s;
          z-index: 20;
          opacity: 0;
        }

        .gallery-section:hover .gallery-nav-btn { opacity: 1; }
        .gallery-nav-btn:hover {
          background: rgba(60, 50, 100, 0.6);
          color: #fff;
          transform: translateY(-50%) scale(1.1);
        }
        .gallery-nav-btn.prev { left: 12px; }
        .gallery-nav-btn.next { right: 12px; }

        .counter-card {
          padding: 24px 16px;
          text-align: center;
          animation: fadeUp 0.8s var(--easing-premium) 0.3s forwards;
          opacity: 0;
        }

        .counter-label {
          font-size: 0.7rem;
          color: var(--text-muted);
          text-transform: uppercase;
          letter-spacing: 0.1em;
          margin-bottom: 14px;
        }

        .counter-grid {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 6px;
        }

        .time-unit {
          display: flex;
          flex-direction: column;
          align-items: center;
          min-width: 52px;
        }

        .time-colon {
          color: var(--text-muted);
          font-size: 1.6rem;
          font-weight: 300;
          padding-bottom: 12px;
        }

        .time-value {
          font-family: var(--font-sans);
          font-size: 1.8rem;
          font-weight: 300;
          color: var(--counter-color);
          line-height: 1;
          margin-bottom: 4px;
          font-variant-numeric: tabular-nums;
        }

        .time-label {
          font-size: 0.6rem;
          color: var(--text-muted);
          letter-spacing: 1px;
        }

        .poem-card {
          padding: 28px 24px;
          text-align: center;
          animation: fadeUp 0.8s var(--easing-premium) 0.45s forwards;
          opacity: 0;
        }

        .poem-text {
          font-family: var(--font-serif);
          font-size: 1.15rem;
          line-height: 2;
          color: var(--text-primary);
          white-space: pre-line;
          margin-bottom: 16px;
        }

        .poem-sig {
          font-size: 0.8rem;
          color: var(--text-secondary);
          font-style: italic;
        }

        /* Music Bar */
        .music-bar {
          position: fixed;
          bottom: 24px;
          left: 50%;
          transform: translateX(-50%);
          width: calc(100% - 40px);
          max-width: 440px;
          background: rgba(18, 16, 40, 0.65);
          -webkit-backdrop-filter: blur(20px);
          backdrop-filter: blur(20px);
          border: 1px solid var(--glass-border);
          padding: 10px 18px;
          border-radius: 99px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
          z-index: 100;
          animation: slideUp 0.6s var(--easing-premium) 0.5s forwards;
          opacity: 0;
        }

        .music-info {
          display: flex;
          align-items: center;
          gap: 12px;
          overflow: hidden;
        }

        .music-icon-spin {
          animation: spin 6s linear infinite;
          opacity: 0.8;
        }

        .music-details {
          display: flex;
          flex-direction: column;
        }

        .music-title {
          font-size: 0.85rem;
          color: var(--text-primary);
          white-space: nowrap;
          font-weight: 500;
        }

        .music-status {
          font-size: 0.7rem;
          color: var(--accent-soft);
        }

        .music-controls {
          display: flex;
          gap: 8px;
        }

        .control-btn {
          background: transparent;
          border: none;
          color: var(--text-primary);
          width: 36px;
          height: 36px;
          border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          cursor: pointer;
          transition: background 0.2s;
        }

        .control-btn:hover {
          background: rgba(255,255,255,0.1);
        }

        .control-btn.primary {
          background: var(--text-primary);
          color: var(--bg-deep);
        }
        .control-btn.primary:hover {
          background: #fff;
          transform: scale(1.05);
        }

        /* Canvas */
        #fireworks-canvas {
          position: fixed;
          inset: 0;
          pointer-events: none;
          z-index: 999;
        }

        @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 30px); } to { opacity: 1; transform: translate(-50%, 0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes auroraBreath {
          0%, 100% { opacity: 0.7; }
          50% { opacity: 1; }
        }
        @keyframes starTwinkle {
          0%, 100% { opacity: 0.6; }
          35% { opacity: 1; }
          70% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback } from 'react';
        import { createRoot } from 'react-dom/client';

        /* === CONFIG === */
        const CONFIG = {
            herName: "（刘念）",
            mySig: "（唐德威）",
            since: "2025-05-30T22:00:00",
            subtitle: "愿我们把平凡的日子，过成只属于彼此的诗。",
            poem: `希望你陪我久一点`,
            photos: [
                { src: "photos/01.jpg", cap: "那天的风很轻，你的笑很亮。" },
                { src: "photos/02.jpg", cap: "你回头的一瞬间，我就知道完了。" },
                { src: "photos/03.jpg", cap: "这一天，时间都慢了一点。" },
                { src: "photos/04.jpg", cap: "我喜欢你笑起来的样子。" },
                { src: "photos/05.jpg", cap: "和你在一起，世界很安静。" },
                { src: "photos/06.jpg", cap: "路灯下，我们并肩走着。" },
                { src: "photos/07.jpg", cap: "你的手，很暖。" },
                { src: "photos/08.jpg", cap: "我希望这样的日子有很多很多。" }
            ],
            musics: [
                { src: "我只在乎你.mp3", name: "我只在乎你" },
                { src: "至少还有你.mp3", name: "至少还有你" }
            ],
            volume: 0.6
        };

        /* === ICONS === */
        const PlayIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>);
        const PauseIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>);
        const NextIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg>);
        const ChevronLeftIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6"/></svg>);
        const ChevronRightIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>);
        const MusicNoteIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>);
        const SparklesIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z"/></svg>);

        /* === COMPONENTS === */

        const TimeCapsule = () => {
            const [timeLeft, setTimeLeft] = useState({ d: 0, h: 0, m: 0, s: 0 });

            useEffect(() => {
                const sinceMs = new Date(CONFIG.since).getTime();
                const tick = () => {
                    const now = Date.now();
                    let diff = Math.max(0, now - sinceMs);
                    
                    const d = Math.floor(diff / (24*3600*1000)); diff -= d*24*3600*1000;
                    const h = Math.floor(diff / (3600*1000)); diff -= h*3600*1000;
                    const m = Math.floor(diff / (60*1000)); diff -= m*60*1000;
                    const s = Math.floor(diff / 1000);
                    
                    setTimeLeft({ d, h, m, s });
                };
                const timer = setInterval(tick, 1000);
                tick();
                return () => clearInterval(timer);
            }, []);

            const format = (n) => String(n).padStart(2, '0');

            return (
                <div className="glass-panel counter-card">
                    <div className="counter-label">We have been together for</div>
                    <div className="counter-grid">
                        <div className="time-unit">
                            <span className="time-value">{timeLeft.d}</span>
                            <span className="time-label">DAYS</span>
                        </div>
                        <span className="time-colon">:</span>
                        <div className="time-unit">
                            <span className="time-value">{format(timeLeft.h)}</span>
                            <span className="time-label">HRS</span>
                        </div>
                        <span className="time-colon">:</span>
                        <div className="time-unit">
                            <span className="time-value">{format(timeLeft.m)}</span>
                            <span className="time-label">MIN</span>
                        </div>
                        <span className="time-colon">:</span>
                        <div className="time-unit">
                            <span className="time-value">{format(timeLeft.s)}</span>
                            <span className="time-label">SEC</span>
                        </div>
                    </div>
                </div>
            );
        };

        const Gallery = ({ photos }) => {
            const [index, setIndex] = useState(0);
            const [isFading, setIsFading] = useState(false);
            
            useEffect(() => {
                photos.forEach(p => { const img = new Image(); img.src = p.src; });
            }, [photos]);

            const changePhoto = useCallback((newIndex) => {
                if (isFading) return;
                setIsFading(true);
                setTimeout(() => {
                    setIndex((newIndex + photos.length) % photos.length);
                    setIsFading(false);
                }, 300);
            }, [isFading, photos.length]);

            const next = () => changePhoto(index + 1);
            const prev = () => changePhoto(index - 1);

            const touchStart = useRef(null);
            const onTouchStart = (e) => touchStart.current = e.touches[0].clientX;
            const onTouchEnd = (e) => {
                if (!touchStart.current) return;
                const diff = e.changedTouches[0].clientX - touchStart.current;
                if (Math.abs(diff) > 50) {
                    diff > 0 ? prev() : next();
                }
                touchStart.current = null;
            };

            const currentPhoto = photos[index];

            return (
                <div
                    className="glass-panel gallery-section"
                    onTouchStart={onTouchStart}
                    onTouchEnd={onTouchEnd}
                >
                    <img
                        src={currentPhoto.src}
                        alt="Memory"
                        className="gallery-image"
                        style={{ opacity: isFading ? 0.3 : 1 }}
                    />

                    <button className="gallery-nav-btn prev" onClick={(e) => {e.stopPropagation(); prev();}}>
                        <ChevronLeftIcon />
                    </button>
                    <button className="gallery-nav-btn next" onClick={(e) => {e.stopPropagation(); next();}}>
                        <ChevronRightIcon />
                    </button>

                    <div className="gallery-dots">
                        {photos.map((_, i) => (
                            <div key={i} className={`gallery-dot ${i === index ? 'active' : ''}`} />
                        ))}
                    </div>

                    <div className="gallery-overlay">
                        <div className="gallery-caption" key={index}>
                            {currentPhoto.cap}
                        </div>
                    </div>
                </div>
            );
        };

        const MusicPlayer = ({ onFireworks }) => {
            const [playing, setPlaying] = useState(false);
            const [trackIdx, setTrackIdx] = useState(0);
            const audioRef = useRef(null);

            useEffect(() => {
                const audio = new Audio();
                audio.volume = CONFIG.volume;
                audio.loop = true;
                audioRef.current = audio;
                return () => { audio.pause(); };
            }, []);

            useEffect(() => {
                if (audioRef.current) {
                    const wasPlaying = !audioRef.current.paused;
                    audioRef.current.src = CONFIG.musics[trackIdx].src;
                    if (wasPlaying || playing) {
                         audioRef.current.play().catch(() => setPlaying(false));
                    }
                }
            }, [trackIdx]);

            const togglePlay = () => {
                if (!audioRef.current) return;
                if (playing) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play().catch(e => console.log("Playback prevented", e));
                }
                setPlaying(!playing);
            };

            const nextSong = () => {
                setTrackIdx((prev) => (prev + 1) % CONFIG.musics.length);
                setPlaying(true);
            };

            return (
                <div className="music-bar">
                    <div className="music-info">
                        <div className={`music-icon-circle ${playing ? 'music-icon-spin' : ''}`} 
                             style={{ width: 32, height: 32, background: 'rgba(255,255,255,0.1)', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                            <MusicNoteIcon />
                        </div>
                        <div className="music-details">
                            <span className="music-title">{CONFIG.musics[trackIdx].name}</span>
                            <span className="music-status">{playing ? 'Playing' : 'Paused'}</span>
                        </div>
                    </div>
                    
                    <div className="music-controls">
                        <button className="control-btn" onClick={onFireworks} title="Fireworks">
                            <SparklesIcon />
                        </button>
                        <button className="control-btn" onClick={nextSong} title="Next Song">
                            <NextIcon />
                        </button>
                        <button className="control-btn primary" onClick={togglePlay}>
                            {playing ? <PauseIcon /> : <PlayIcon />}
                        </button>
                    </div>
                </div>
            );
        };

        const FireworksCanvas = ({ trigger }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                let particles = [];
                let animationId = 0;

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', resize);
                resize();

                const createParticle = (x, y) => {
                    const hue = Math.random() * 40 + 320; 
                    return {
                        x, y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        life: 100 + Math.random() * 50,
                        color: `hsla(${hue}, 80%, 70%,`,
                        alpha: 1,
                        gravity: 0.05
                    };
                };

                const burst = () => {
                     const x = Math.random() * canvas.width;
                     const y = Math.random() * (canvas.height * 0.6);
                     for(let i=0; i<80; i++) particles.push(createParticle(x, y));
                };

                if (trigger > 0) {
                    burst();
                    setTimeout(burst, 300); 
                }

                const loop = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += p.gravity;
                        p.life--;
                        p.alpha = Math.max(0, p.life / 100);

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                        ctx.fillStyle = `${p.color} ${p.alpha})`;
                        ctx.fill();

                        if (p.life <= 0) particles.splice(i, 1);
                    }
                    
                    animationId = requestAnimationFrame(loop);
                };
                loop();

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('resize', resize);
                };
            }, [trigger]);

            return <canvas id="fireworks-canvas" ref={canvasRef} />;
        };

        function App() {
            const [fireworkTrigger, setFireworkTrigger] = useState(0);

            const handleFireworks = () => {
                setFireworkTrigger(prev => prev + 1);
            };

            return (
                <div className="app-container">
                    <FireworksCanvas trigger={fireworkTrigger} />

                    <header>
                        <h1 className="main-title">
                            从那天起，每个日子都有了意义
                        </h1>
                        <div className="subtitle">{CONFIG.subtitle}</div>
                    </header>

                    <div className="flow-column">
                        <Gallery photos={CONFIG.photos} />
                        <TimeCapsule />
                        <div className="glass-panel poem-card">
                            <div className="poem-text">{CONFIG.poem}</div>
                            <div className="poem-sig">—— {CONFIG.mySig}</div>
                        </div>
                    </div>

                    <MusicPlayer onFireworks={handleFireworks} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
